services:
    _defaults:
        autowire: true
        autoconfigure: true

    Derkosmonaut\OpenTimesBundle\Resolver\:
        resource: ../src/Resolver/
        exclude: ../src/Resolver/Model/

    Derkosmonaut\OpenTimesBundle\Output\:
        resource: ../src/Output/

    Derkosmonaut\OpenTimesBundle\Diagnostics\:
        resource: ../src/Diagnostics/

    Derkosmonaut\OpenTimesBundle\Repository\:
        resource: ../src/Repository/

    Derkosmonaut\OpenTimesBundle\EventListener\:
        resource: ../src/EventListener/

    Derkosmonaut\OpenTimesBundle\Controller\:
        resource: ../src/Controller/
        public: true
